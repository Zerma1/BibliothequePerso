org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compilation Kotlin incrémentale désactivée : le projet est sur D: et le cache pub (sources
# Kotlin des plugins workmanager_android, url_launcher_android…) sur C:. Le cache incrémental
# de Kotlin plante alors (« this and base files have different roots »). Seul coût : les
# plugins sont recompilés entièrement, ce qui reste rapide. À retirer si le cache pub est
# déplacé sur le même disque que le projet.
kotlin.incremental=false
