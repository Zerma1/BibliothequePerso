# Compilation simultanée Windows, Linux et Android (étape 9 de la feuille de route).
# Procédure et explications : docs/DEPLOIEMENT.md, section « Compilation automatique ».
#
# - push sur `test`      : vérification + 3 compilations, fichiers en artefacts du workflow ;
# - étiquette `v*`        : idem + « release » GitHub (pre-release si l'étiquette contient -test.) ;
# - lancement manuel      : onglet Actions > Compilation > « Run workflow ».
# Rien n'est lancé sur `dev` (économie de minutes GitHub).
#
# Aucun secret à créer : seul le GITHUB_TOKEN fourni par GitHub est utilisé.
# Aucune clé de signature : l'APK est signé avec la clé de développement de Flutter
# (android/app/build.gradle.kts, signingConfig "debug"), comme les builds faits à la main.
# LIMITE : la machine GitHub étant neuve à chaque exécution, cette clé change très
# probablement d'une compilation à l'autre (mise à jour impossible sans désinstaller).

name: Compilation

on:
  push:
    branches:
      - test
    tags:
      - "v*"
  workflow_dispatch:

# Droits minimaux ; seul le job « publication » demande l'écriture (création de la release).
permissions:
  contents: read

# Un nouveau push sur `test` annule la compilation précédente encore en cours de la même
# branche (économie de minutes) ; une compilation d'étiquette n'est jamais annulée.
concurrency:
  group: compilation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  # Version exacte du projet (.metadata : révision ab2912035e…, canal stable).
  FLUTTER_VERSION: "3.50.0"
  FLUTTER_REVISION: "ab2912035e160d9cad6306df307576da6128ebdb"

jobs:
  # ---------------------------------------------------------------------------
  # Calcule la version des fichiers et décide s'il faut compiler et publier.
  # ---------------------------------------------------------------------------
  preparation:
    name: Préparation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      construire: ${{ steps.version.outputs.construire }}
      publier: ${{ steps.version.outputs.publier }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculer la version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Ligne « version: X.Y.Z+N » de pubspec.yaml.
          VERSION_PUBSPEC="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')"
          XYZ="${VERSION_PUBSPEC%%+*}"
          BUILD="${VERSION_PUBSPEC#*+}"
          CONSTRUIRE=true
          PUBLIER=false
          PRERELEASE=false

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Étiquette vX.Y.Z ou vX.Y.Z-test.N : la version est celle de l'étiquette.
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION%%-*}" != "${XYZ}" ]; then
              echo "::error::L'étiquette ${GITHUB_REF_NAME} ne correspond pas à pubspec.yaml (${VERSION_PUBSPEC})."
              exit 1
            fi
            PUBLIER=true
            case "${VERSION}" in
              *-test.*) PRERELEASE=true ;;
            esac
          else
            # Push sur une branche ou lancement manuel : X.Y.Z-build.N.
            VERSION="${XYZ}-build.${BUILD}"
            # `git push origin test --follow-tags` déclenche deux exécutions (branche et
            # étiquette). Si le commit porte déjà une étiquette v*, on laisse l'exécution de
            # l'étiquette tout faire et on ne compile pas deux fois.
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && \
               git ls-remote --tags origin 'refs/tags/v*' | grep -q "^${GITHUB_SHA}[[:space:]]"; then
              echo "::notice::Commit étiqueté : la compilation est faite par l'exécution de l'étiquette."
              CONSTRUIRE=false
            fi
          fi

          echo "Version : ${VERSION} (construire=${CONSTRUIRE}, publier=${PUBLIER}, prerelease=${PRERELEASE})"
          {
            echo "version=${VERSION}"
            echo "construire=${CONSTRUIRE}"
            echo "publier=${PUBLIER}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # flutter analyze + flutter test : les trois compilations en dépendent.
  # ---------------------------------------------------------------------------
  verification:
    name: Analyse et tests
    needs: preparation
    if: needs.preparation.outputs.construire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Vérifier la version de Flutter
        shell: bash
        run: |
          flutter --version
          flutter --version --machine | grep -q "\"frameworkRevision\": *\"${FLUTTER_REVISION}\"" \
            || { echo "::error::Flutter installé différent de ${FLUTTER_VERSION} (${FLUTTER_REVISION})."; exit 1; }

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

  # ---------------------------------------------------------------------------
  # Windows : dossier Release complet compressé en .zip.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows
    needs: [preparation, verification]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Vérifier la version de Flutter
        shell: bash
        run: |
          flutter --version
          flutter --version --machine | grep -q "\"frameworkRevision\": *\"${FLUTTER_REVISION}\"" \
            || { echo "::error::Flutter installé différent de ${FLUTTER_VERSION} (${FLUTTER_REVISION})."; exit 1; }

      - name: Dépendances
        run: flutter pub get

      - name: Compiler
        run: flutter build windows --release

      - name: Compresser
        shell: pwsh
        run: |
          $fichier = "bibliotheque_perso-$env:VERSION-windows.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $fichier
          Get-Item $fichier | Select-Object Name, Length

      - name: Publier l'artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: bibliotheque_perso-${{ env.VERSION }}-windows.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Linux : dossier bundle compressé en .tar.gz.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux
    needs: [preparation, verification]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Paquets système pour la compilation Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Vérifier la version de Flutter
        shell: bash
        run: |
          flutter --version
          flutter --version --machine | grep -q "\"frameworkRevision\": *\"${FLUTTER_REVISION}\"" \
            || { echo "::error::Flutter installé différent de ${FLUTTER_VERSION} (${FLUTTER_REVISION})."; exit 1; }

      - name: Dépendances
        run: flutter pub get

      - name: Compiler
        run: flutter build linux --release

      - name: Compresser
        shell: bash
        run: |
          set -euo pipefail
          # L'archive contient un dossier bibliotheque_perso-<version>/ (exécutable, lib/, data/).
          DOSSIER="bibliotheque_perso-${VERSION}"
          cp -r build/linux/x64/release/bundle "${DOSSIER}"
          tar -czf "${DOSSIER}-linux.tar.gz" "${DOSSIER}"
          ls -l "${DOSSIER}-linux.tar.gz"

      - name: Publier l'artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: bibliotheque_perso-${{ env.VERSION }}-linux.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Android : APK de publication (signé avec la clé de développement).
  # ---------------------------------------------------------------------------
  android:
    name: Android
    needs: [preparation, verification]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Vérifier la version de Flutter
        shell: bash
        run: |
          flutter --version
          flutter --version --machine | grep -q "\"frameworkRevision\": *\"${FLUTTER_REVISION}\"" \
            || { echo "::error::Flutter installé différent de ${FLUTTER_VERSION} (${FLUTTER_REVISION})."; exit 1; }

      - name: Dépendances
        run: flutter pub get

      - name: Compiler
        run: flutter build apk --release

      - name: Renommer
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "bibliotheque_perso-${VERSION}-android.apk"
          ls -l "bibliotheque_perso-${VERSION}-android.apk"

      - name: Publier l'artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: bibliotheque_perso-${{ env.VERSION }}-android.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Étiquette v* : « release » GitHub avec les trois fichiers.
  # ---------------------------------------------------------------------------
  publication:
    name: Release GitHub
    needs: [preparation, windows, linux, android]
    if: needs.preparation.outputs.publier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
      PRERELEASE: ${{ needs.preparation.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Récupérer les trois fichiers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bibliotheque_perso-*
          path: livrables
          merge-multiple: true

      - name: Créer ou compléter la release
        shell: bash
        run: |
          set -euo pipefail
          ls -l livrables
          FICHIERS=(
            "livrables/bibliotheque_perso-${VERSION}-windows.zip"
            "livrables/bibliotheque_perso-${VERSION}-linux.tar.gz"
            "livrables/bibliotheque_perso-${VERSION}-android.apk"
          )
          for f in "${FICHIERS[@]}"; do
            [ -f "$f" ] || { echo "::error::Fichier manquant : $f"; exit 1; }
          done

          if [ "${PRERELEASE}" = "true" ]; then
            TITRE="${VERSION} (version de test)"
            OPTIONS=(--prerelease)
          else
            TITRE="${VERSION}"
            OPTIONS=()
          fi
          NOTES="Fichiers compilés automatiquement (workflow Compilation). Nouveautés : voir docs/VERSIONS.md. Installation : voir docs/DEPLOIEMENT.md."

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            # Relance du workflow : on remplace les fichiers de la release existante.
            gh release upload "${GITHUB_REF_NAME}" "${FICHIERS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${FICHIERS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${TITRE}" \
              --notes "${NOTES}" \
              "${OPTIONS[@]}"
          fi
