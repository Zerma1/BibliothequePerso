name: bibliotheque_perso
description: "Bibliothèque personnelle multiplateforme qui regroupe les livres, mangas et manhwas suivis sur plusieurs sites de lecture."
# Application privée : empêche toute publication accidentelle sur pub.dev.
publish_to: 'none'

# Format X.Y.Z+N (voir PLAYBOOK.md section 12) : N est le numéro de build, qui doit
# augmenter à chaque version publiée sur Android (versionCode).
version: 0.3.3+14

environment:
  sdk: ^3.14.0

# Seuls les paquets listés dans PLAYBOOK.md (section 3) sont autorisés.
# Tout nouveau paquet doit d'abord être validé par l'orchestrateur et le client.
dependencies:
  flutter:
    sdk: flutter
  # Widgets Material (MaterialApp, Scaffold…) : avec Flutter 3.50, le modèle
  # `flutter create` les importe depuis ce paquet et non plus depuis le SDK.
  material_ui: ^1.1.0

  # Requêtes HTTP (utilisé uniquement par ClientHttpPoli).
  http: ^1.6.0
  # Analyse HTML avec sélecteurs CSS.
  html: ^0.15.7
  # SQLite : sqflite sur Android, sqflite_common_ffi sur Windows et Linux.
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  # Dossiers système de l'application et manipulation de chemins.
  path_provider: ^2.1.6
  path: ^1.9.1
  # Archives .zip des chapitres téléchargés.
  archive: ^4.7.1
  # Gestion d'état (ChangeNotifier).
  provider: ^6.1.5+1
  # Tâche de fond périodique, initialisée uniquement sur Android.
  workmanager: ^0.10.10
  # Ouverture d'un site dans le navigateur.
  url_launcher: ^6.3.3
  # Navigateur intégré (lecture web) : Android (WebView) et Windows (WebView2).
  # Version bêta : la 6.1.5 (dernière stable) ne compile pas avec AGP 9
  # (getDefaultProguardFile('proguard-android.txt') refusé). Version exacte, sans ^.
  # Windows : la compilation exige nuget.exe dans le PATH (dépendances WebView2).
  # Linux : la bêta ajoute flutter_inappwebview_linux (WPE WebKit requis pour compiler),
  # remplacé par un paquet vide (dependency_overrides ci-dessous) ; le code n'y crée
  # jamais de vue web et garde url_launcher.
  flutter_inappwebview: 6.2.0-beta.3
  # Icône dans la zone de notification (fermer = réduire dans les icônes masquées),
  # utilisée sous Windows seulement pour l'instant (accord du client du 2026-11-25).
  # Construit sur nativeapi, dont la bibliothèque C++ est compilée par un « build hook »
  # à chaque compilation : Visual Studio sous Windows, NDK sous Android, et sous Linux
  # les paquets de développement GTK 3, X11 et Xi (libgtk-3-dev libx11-dev libxi-dev).
  # La fenêtre elle-même (cacher, afficher) est gérée par le programme natif
  # (windows/runner/flutter_window.cpp) : window_manager, également autorisé, n'est pas
  # nécessaire.
  tray_manager: ^0.9.1
  # Démarrage avec Windows (clé HKCU\...\Run), appelé sous Windows seulement.
  launch_at_startup: ^0.5.1
  file_picker: ^11.0.3

# Pas de navigateur intégré sous Linux (choix du client) : la partie Linux de
# flutter_inappwebview exigerait WPE WebKit à la compilation et sur le poste. Ce paquet
# local du même nom n'est pas un plugin : rien n'est compilé ni enregistré pour Linux.
# Détails : paquets/flutter_inappwebview_linux_vide/pubspec.yaml.
dependency_overrides:
  flutter_inappwebview_linux:
    path: paquets/flutter_inappwebview_linux_vide

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Règles d'analyse recommandées, complétées dans analysis_options.yaml.
  flutter_lints: ^6.0.0

flutter:
  # Embarque la police d'icônes Material (classe Icons).
  uses-material-design: true
  # Logo de l'icône de la zone de notification (Windows), lu par tray_manager dans
  # data/flutter_assets à côté de l'exécutable.
  assets:
    - assets/logo/logo.ico
